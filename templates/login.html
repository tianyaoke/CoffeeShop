<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Daily Brew</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url("{{ url_for('static', filename='images/menu-bg.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
        }

        .login-container {
            min-vh: 100vh;
        }

        .custom-login-card {
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #dcdcdc;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            max-width: 450px;
        }

        .custom-login-card h3 {
            color: #333;
            font-weight: 600;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #c0c0c0;
        }
        
        .form-control:focus {
            border-color: #6c5a4d;
            box-shadow: 0 0 0 0.25rem rgba(108, 90, 77, 0.25);
        }

        .btn-brand {
            background-color: #6c5a4d;
            color: white;
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-brand:hover {
            background-color: #5a4b40;
            color: white;
        }

        .text-center small a {
            color: #6c5a4d;
            text-decoration: none;
            font-weight: 600;
        }
        .text-center small a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">The Daily Brew</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('about_page') }}">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Order</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('login') }}">Login</a></li>
                    <li class="nav-item"><a class="nav-link register-link" href="{{ url_for('register') }}">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center login-container py-5 mt-5">
        <div class="card p-5 shadow custom-login-card w-100">
            <h3 class="text-center mb-4">Welcome Back</h3>
            
            <form action="{{ url_for('login') }}" method="POST">
                
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn btn-brand w-100 py-2">Login</button>
            </form>
            
            <div class="text-center mt-3">
                <small class="text-muted">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></small>
            </div>
        </div>
    </div>

</body>
</html>
