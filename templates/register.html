<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - The Daily Brew</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url("{{ url_for('static', filename='images/menu-bg.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
        }

        .register-container {
            min-height: 85vh;
        }

        .custom-register-card {
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #e0d5c8;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            max-width: 450px;
        }

        .custom-register-card h3 {
            color: #6f4e37;
            font-weight: 600;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #c0c0c0;
        }

        /* Seamless border highlighting style when user selects the password group */
        .input-group:focus-within .form-control,
        .input-group:focus-within .btn {
            border-color: #6f4e37 !important;
            box-shadow: none;
        }
        
        .form-control:focus:not(.input-group .form-control) {
            border-color: #6f4e37;
            box-shadow: 0 0 0 0.25rem rgba(111, 78, 55, 0.25);
        }

        .btn-brand {
            background-color: #6f4e37;
            color: white;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-brand:hover {
            background-color: #5a3d2b;
            color: white;
        }

        .text-center a {
            color: #6f4e37;
            text-decoration: none;
            font-weight: 600;
        }
        .text-center a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">The Daily Brew</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('menu_page') }}">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('order_page') }}">Order</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
                    <li class="nav-item"><a class="nav-link register-link active" href="{{ url_for('register') }}">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center register-container py-5">
        <div class="card p-4 p-md-5 custom-register-card w-100">
            <h3 class="text-center mb-2">Create Account</h3>
            <p class="text-muted text-center small mb-4">Join us to start placing your orders online.</p>
            
            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold small text-secondary">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-bold small text-secondary">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-bold small text-secondary">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Choose a secure password" required style="border-right: none;">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword" style="border-left: none; background: transparent; border-color: #c0c0c0;">
                            <span id="eyeIcon">👁️</span>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-brand w-100 py-2 fs-6">Sign Up</button>
            </form>

            <div class="text-center mt-4">
                <p class="small text-muted mb-0">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
            </div>
        </div>
    </div>

    <footer class="footer text-center py-3 mt-auto">
        <p>&copy; 2026 The Daily Brew Shop. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleButton.addEventListener('click', function () {
            // Check current input state and reverse it cleanly
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle visual icons based on visibility state
            if (type === 'text') {
                eyeIcon.textContent = '🙈';
            } else {
                eyeIcon.textContent = '👁️';
            }
        });
    </script>
</body>
</html>
