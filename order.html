<!DOCTYPE html>
<html>
<head>
    <title>Daily Brew Coffee Shop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4e7d3;
            padding: 2rem;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #6f4e37;
            font-size: 26px;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 1.5rem;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 1.5rem;
        }
        .menu-card {
            background: #faf8f5;
            border: 1.5px solid #e0d5c8;
            border-radius: 10px;
            padding: 1rem;
            transition: border-color 0.2s;
        }
        .menu-card.selected {
            border: 2px solid #6f4e37;
            background: #fdf6ef;
        }
        .menu-card-icon {
            font-size: 26px;
            margin-bottom: 6px;
        }
        .tag {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .tag-hot { background: #FAECE7; color: #993C1D; }
        .tag-cold { background: #E6F1FB; color: #185FA5; }
        .tag-popular { background: #EAF3DE; color: #3B6D11; }
        .menu-card-name {
            font-size: 15px;
            font-weight: 600;
            color: #3b2a1a;
            margin-bottom: 2px;
        }
        .menu-card-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }
        .menu-card-price {
            font-size: 13px;
            color: #6f4e37;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .qty-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1.5px solid #d0c0b0;
            background: white;
            color: #6f4e37;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .qty-btn:hover { background: #f4e7d3; }
        .qty-num {
            font-size: 15px;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
            color: #3b2a1a;
        }
        .order-summary {
            background: #faf8f5;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid #e0d5c8;
        }
        .summary-title {
            font-size: 12px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 10px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #3b2a1a;
            padding: 4px 0;
        }
        .summary-divider {
            border: none;
            border-top: 1px solid #e0d5c8;
            margin: 8px 0;
        }
        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 600;
            color: #3b2a1a;
            padding: 4px 0;
        }
        .empty-msg {
            font-size: 13px;
            color: #bbb;
            text-align: center;
            padding: 8px 0;
        }
        .order-btn {
            width: 100%;
            padding: 13px;
            background: #6f4e37;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.02em;
        }
        .order-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .order-btn:not(:disabled):hover { background: #5a3d2b; }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #6f4e37;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
<div class="container">
    <h1>☕ Daily Brew Coffee Shop</h1>
    <p class="subtitle">Freshly brewed, made to order</p>

    <div class="menu-grid" id="menuGrid"></div>

    <div class="order-summary">
        <div class="summary-title">Your Order</div>
        <div id="summaryItems"><p class="empty-msg">No items selected yet</p></div>
        <hr class="summary-divider" id="summaryDivider" style="display:none">
        <div class="summary-total" id="summaryTotal" style="display:none">
            <span>Total</span>
            <span id="totalAmount">Ksh 0</span>
        </div>
    </div>

    <button class="order-btn" id="orderBtn" disabled onclick="placeOrder()">Place Order</button>
</div>

<div class="toast" id="toast"></div>

<script>
    const menu = [
        { id: 'espresso',   name: 'Espresso',   price: 200, desc: 'Rich, bold single shot',           tag: 'hot',     tagLabel: 'Hot' },
        { id: 'cappuccino', name: 'Cappuccino', price: 300, desc: 'Espresso with steamed milk foam',  tag: 'popular', tagLabel: 'Popular' },
        { id: 'latte',      name: 'Latte',      price: 350, desc: 'Smooth espresso with silky milk',  tag: 'popular', tagLabel: 'Popular' },
        { id: 'americano',  name: 'Americano',  price: 250, desc: 'Espresso diluted with hot water',  tag: 'hot',     tagLabel: 'Hot' },
        { id: 'mocha',      name: 'Mocha',      price: 380, desc: 'Espresso with chocolate & milk',   tag: 'popular', tagLabel: 'Popular' },
        { id: 'cold_brew',  name: 'Cold Brew',  price: 400, desc: 'Slow-steeped, served chilled',     tag: 'cold',    tagLabel: 'Cold' },
    ];

    const quantities = {};
    menu.forEach(item => quantities[item.id] = 0);

    const icons = { hot: '☕', cold: '🧊', popular: '⭐' };

    function renderMenu() {
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = menu.map(item => `
            <div class="menu-card ${quantities[item.id] > 0 ? 'selected' : ''}" id="card-${item.id}">
                <div class="menu-card-icon">${icons[item.tag]}</div>
                <span class="tag tag-${item.tag}">${item.tagLabel}</span>
                <div class="menu-card-name">${item.name}</div>
                <div class="menu-card-desc">${item.desc}</div>
                <div class="menu-card-price">Ksh ${item.price.toLocaleString()}</div>
                <div class="qty-control">
                    <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
                    <span class="qty-num" id="qty-${item.id}">${quantities[item.id]}</span>
                    <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                </div>
            </div>
        `).join('');
    }

    function changeQty(id, delta) {
        quantities[id] = Math.max(0, quantities[id] + delta);
        document.getElementById('qty-' + id).textContent = quantities[id];
        document.getElementById('card-' + id).classList.toggle('selected', quantities[id] > 0);
        updateSummary();
    }

    function updateSummary() {
        const ordered = menu.filter(item => quantities[item.id] > 0);
        const total = ordered.reduce((sum, item) => sum + item.price * quantities[item.id], 0);
        const summaryItems = document.getElementById('summaryItems');
        const summaryDivider = document.getElementById('summaryDivider');
        const summaryTotal = document.getElementById('summaryTotal');
        const orderBtn = document.getElementById('orderBtn');

        if (ordered.length === 0) {
            summaryItems.innerHTML = '<p class="empty-msg">No items selected yet</p>';
            summaryDivider.style.display = 'none';
            summaryTotal.style.display = 'none';
            orderBtn.disabled = true;
        } else {
            summaryItems.innerHTML = ordered.map(item => `
                <div class="summary-row">
                    <span>${item.name} × ${quantities[item.id]}</span>
                    <span>Ksh ${(item.price * quantities[item.id]).toLocaleString()}</span>
                </div>
            `).join('');
            summaryDivider.style.display = 'block';
            summaryTotal.style.display = 'flex';
            document.getElementById('totalAmount').textContent = 'Ksh ' + total.toLocaleString();
            orderBtn.disabled = false;
        }
    }

    function placeOrder() {
        const ordered = menu.filter(item => quantities[item.id] > 0);
        const total = ordered.reduce((sum, item) => sum + item.price * quantities[item.id], 0);
        const summary = ordered.map(item => `${quantities[item.id]}x ${item.name}`).join(', ');
        showToast('Order placed! ' + summary + ' — Ksh ' + total.toLocaleString());
        menu.forEach(item => quantities[item.id] = 0);
        renderMenu();
        updateSummary();
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    renderMenu();
    updateSummary();
</script>
</body>
</html>
